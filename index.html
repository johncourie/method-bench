<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Open reversed-phase LC method-development simulator for teaching. Scouting, selectivity, system suitability, calibration and validation on published retention data." />
    <title>Method Bench</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/ui/styles.css" />
